$kind: http-request
url: "{{baseUrl}}/webhooks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Deployment events",
      "targetUrl": "https://example.com/webhook"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Endpoint is created', function () {
        pm.response.to.have.status(201);
      });
      pm.collectionVariables.set('webhookId', pm.response.json().data.id);
    language: text/javascript
order: 2000
